services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: mini-siem-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: mini-siem-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

  backend:
    build:
      context: ./backend
    container_name: mini-siem-backend
    environment:
      APP_ENV: docker
      APP_LOG_PATH: /var/log/mini-siem/app.log
      SERVICE_NAME: mini-siem-backend
    depends_on:
      - elasticsearch
    ports:
      - "8000:8000"
    volumes:
      - backend-logs:/var/log/mini-siem

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: mini-siem-filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      - elasticsearch
      - kibana
      - backend
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - backend-logs:/var/log/mini-siem:ro

volumes:
  esdata:
  backend-logs:

